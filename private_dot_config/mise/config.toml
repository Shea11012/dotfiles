[tools]
node = "26.12.1"
go = "latest"
usage = "latest"
golangci-lint = "latest"
biome = "latest"
"github:go-delve/delve" = "latest"
buf = "latest"
task = "latest"
"github:pressly/goose" = "latest"
"npm:mcporter" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@mistweaverco/kulala-fmt" = "latest"
"pipx:ruff" = "latest"
"npm:@kitschpatrol/tldraw-cli" = "latest"
"github:tree-sitter/tree-sitter" = "latest"
"github:pranshuparmar/witr" = "latest"
python = "3.14.8"
"npm:@deepseek-ai/dsh" = "v0.2.1-rc.2"
duckdb = "latest"
"github:scriptscat/sctl" = "latest"

[tools."github:pnpm/pnpm"]
version = "latest"
asset_pattern = "pnpm-linux-x64.tar.gz"

[settings]
legacy_version_file = true
not_found_auto_install = true
experimental = true
status = { missing_tools = "if_other_versions_installed", show_env = false, show_tools = false }
idiomatic_version_file_enable_tools = []

[settings.python]
uv_venv_auto = "source"

[settings.npm]
package_manager = "npm"

[env]
_.file = [
    '~/.envs/third-party.toml',
    '~/.envs/vpn.toml',
    { path = "~/.envs/ai-api-key.json", redact = true }
]
